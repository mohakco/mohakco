name: Update profile README

on:
  push:
    branches: [main]
    paths:
      - README.gtpl
      - .github/workflows/action.yml
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check profile token
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo '::error::Add the GH_PAT repository secret for mohakco. See the comments in this workflow.'
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install markscribe
        run: go install github.com/muesli/markscribe@v0.6.0

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: markscribe -write README.md README.gtpl

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: refresh profile activity'
          file_pattern: README.md
