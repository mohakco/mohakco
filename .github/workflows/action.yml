name: Update profile README

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/update_activity.py
      - .github/workflows/action.yml
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Only public data is read, so the built-in token is sufficient.
      # Do not reintroduce a personal access token here: classic tokens are
      # rejected by orgs that forbid them, and fine-grained tokens cannot read
      # the cross-repository pull request activity this profile shows.
      - name: Update activity sections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_activity.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: refresh profile activity'
          file_pattern: README.md
